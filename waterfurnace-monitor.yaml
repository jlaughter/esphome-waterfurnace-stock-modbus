                     (rssi >= ${wifi_bar_1_rssi}) ? 1 : 0;
          for (int i = 0; i < 4; i++) {
            int bar_h = 3 + i * 3;
            if (i < bars) {
              it.filled_rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            } else {
              it.rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            }
          }
          it.horizontal_line(0, 16, 128);

          // ---- body ----
          if (!id(com_ok).state) {
            it.print(0, 20, id(font_main), "-- -- --");
          } else {
            std::string blower_txt;
            if (id(blower_on).state) {
              int ecm = (int) id(blower_ecm_speed).state;
              blower_txt = "Blower: ON (ECM " + std::to_string(ecm) + ")";
            } else {
              blower_txt = "Blower: OFF";
            }
            it.print(0, 18, id(font_small), blower_txt.c_str());

            float entering = id(entering_air_temp).state;
            if (std::isnan(entering)) {
              it.print(0, 29, id(font_small), "Entering Air: N/A");
            } else {
              it.printf(0, 29, id(font_small), "Entering Air: %.1fF", entering);
            }

            float leaving = id(leaving_air_temp).state;
            if (std::isnan(leaving)) {
              it.print(0, 40, id(font_small), "Leaving Air: N/A");
            } else {
              it.printf(0, 40, id(font_small), "Leaving Air: %.1fF", leaving);
            }
          }

      - id: page_water
        lambda: |-
          // ---- shared header ----
          std::string status_text;
          if (!id(com_ok).state) {
            status_text = "LINK DOWN";
          } else if (id(locked_out).state) {
            status_text = "LOCK";
          } else {
            status_text = id(current_mode).state;
          }
          it.print(0, 0, id(font_small), status_text.c_str());

          int rssi = id(device_wifi_signal).state;
          int bars = (rssi >= ${wifi_bar_4_rssi}) ? 4 :
                     (rssi >= ${wifi_bar_3_rssi}) ? 3 :
                     (rssi >= ${wifi_bar_2_rssi}) ? 2 :
                     (rssi >= ${wifi_bar_1_rssi}) ? 1 : 0;
          for (int i = 0; i < 4; i++) {
            int bar_h = 3 + i * 3;
            if (i < bars) {
              it.filled_rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            } else {
              it.rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            }
          }
          it.horizontal_line(0, 16, 128);

          // ---- body ----
          if (!id(com_ok).state) {
            it.print(0, 20, id(font_main), "-- -- --");
          } else {
            it.printf(0, 18, id(font_small), "Water Flow: %.1f gpm", id(waterflow).state);
            it.printf(0, 29, id(font_small), "Entering: %.1fF", id(entering_water_temp).state);
            it.printf(0, 40, id(font_small), "Leaving: %.1fF", id(leaving_water_temp).state);
          }

      - id: page_energy1
        lambda: |-
          // ---- shared header ----
