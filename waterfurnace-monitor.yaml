      std::string s = compute();
      if (id(lockout_fault_description).has_state() && s == id(lockout_fault_description).state) return {};
      return s;

########################################################################
# Display — 128x64 SSD1306, yellow top 16px used as a status header,
# blue bottom 48px for page content. Six pages in normal rotation: HVAC,
# Fault/Lockout, Air, Water, Energy 1 (voltage/amps), Energy 2 (wattage).
# page_diag is not part of the rotation — it only shows on link-down or
# when the "Show Signal Diagnostics" switch is on.
########################################################################

display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 1s
    pages:
      - id: page_hvac
        lambda: |-
          // ---- shared header ----
          std::string status_text;
          if (!id(com_ok).state) {
            status_text = "LINK DOWN";
          } else if (id(locked_out).state) {
            status_text = "LOCK";
          } else {
            status_text = id(current_mode).state;
          }
          it.print(0, 0, id(font_small), status_text.c_str());

          int rssi = id(device_wifi_signal).state;
          int bars = (rssi >= ${wifi_bar_4_rssi}) ? 4 :
                     (rssi >= ${wifi_bar_3_rssi}) ? 3 :
                     (rssi >= ${wifi_bar_2_rssi}) ? 2 :
                     (rssi >= ${wifi_bar_1_rssi}) ? 1 : 0;
          for (int i = 0; i < 4; i++) {
            int bar_h = 3 + i * 3;
            if (i < bars) {
              it.filled_rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            } else {
              it.rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            }
          }
          it.horizontal_line(0, 16, 128);

          // ---- body ----
          if (!id(com_ok).state) {
            it.print(0, 20, id(font_main), "-- -- --");
            it.print(0, 46, id(font_small), "waiting for link...");
          } else {
            it.printf(0, 18, id(font_main), "%s", id(current_mode).state.c_str());
            std::string blower_txt;
            if (id(blower_on).state) {
              int ecm = (int) id(blower_ecm_speed).state;
              blower_txt = "Blower: ON (ECM " + std::to_string(ecm) + ")";
            } else {
              blower_txt = "Blower: OFF";
            }
            it.print(0, 40, id(font_small), blower_txt.c_str());
            std::string aux_txt = (id(aux_heat_1).state || id(aux_heat_2).state) ? "Aux Heat: ON" : "Aux Heat: OFF";
            it.print(0, 52, id(font_small), aux_txt.c_str());
          }

      - id: page_fault
        lambda: |-
          // ---- shared header ----
          std::string status_text;
          if (!id(com_ok).state) {
            status_text = "LINK DOWN";
          } else if (id(locked_out).state) {
            status_text = "LOCK";
          } else {
            status_text = id(current_mode).state;
          }
          it.print(0, 0, id(font_small), status_text.c_str());

          int rssi = id(device_wifi_signal).state;
          int bars = (rssi >= ${wifi_bar_4_rssi}) ? 4 :
                     (rssi >= ${wifi_bar_3_rssi}) ? 3 :
                     (rssi >= ${wifi_bar_2_rssi}) ? 2 :
                     (rssi >= ${wifi_bar_1_rssi}) ? 1 : 0;
          for (int i = 0; i < 4; i++) {
            int bar_h = 3 + i * 3;
            if (i < bars) {
              it.filled_rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            } else {
              it.rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            }
          }
          it.horizontal_line(0, 16, 128);

          // ---- body ----
          if (!id(com_ok).state) {
            it.print(0, 20, id(font_main), "-- -- --");
          } else {
            // register 25 (last_fault_code/fault_description) is the live,
            // self-clearing pair — always synced with `locked_out`, since
            // they come from the exact same register read. Register 26's
            // "Last Lockout Event" fields are historical only and deliberately
            // not used here; see header comment.
            int code = (int) id(last_fault_code).state;
            std::string desc = id(fault_description).state;
            std::string state_line;
            if (id(locked_out).state) {
              state_line = "LOCKOUT  Code:" + std::to_string(code);
            } else {
              state_line = (code == 0) ? "OK - No Fault" : ("Last Fault:" + std::to_string(code));
            }
            it.print(0, 18, id(font_small), state_line.c_str());

            // word-unaware wrap, ~20 chars/line, 3 lines
            const size_t chars_per_line = 20;
            for (int line = 0; line < 3; line++) {
              size_t start = line * chars_per_line;
              if (start >= desc.length()) break;
              std::string chunk = desc.substr(start, chars_per_line);
              it.print(0, 29 + line * 11, id(font_small), chunk.c_str());
            }
          }

      - id: page_air
        lambda: |-
          // ---- shared header ----
          std::string status_text;
