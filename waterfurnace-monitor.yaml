            } else {
              it.rectangle(108 + i * 5, 16 - bar_h, 4, bar_h);
            }
          }
          it.horizontal_line(0, 16, 128);

          // ---- body ----
          if (!id(com_ok).state) {
            it.print(0, 20, id(font_main), "-- -- --");
          } else {
            it.printf(0, 18, id(font_small), "Line Voltage: %.0fV", id(line_voltage).state);
            it.printf(0, 29, id(font_small), "Comp1: %.1fA", id(compressor_1_amps).state);
            it.printf(0, 40, id(font_small), "Comp2: %.1fA", id(compressor_2_amps).state);
            it.printf(0, 51, id(font_small), "Blower: %.1fA", id(blower_amps).state);
          }

      - id: page_energy2
        lambda: |-
          // ---- shared header ----
