########################################################################
# Derived text — human-readable mode string from the output bits above.
# RV-energized = Cooling — matches upstream's get_current_mode_string()
# exactly (see header comment) and confirmed against the AID tool.
########################################################################

text_sensor:
  - platform: template
    id: current_mode
    name: "Current Mode"
    update_interval: ${update_interval_s}s
    lambda: |-
      // Only publish when the text actually changes -- this template
      // re-evaluates every poll, and an identical string would otherwise
      // be pushed to the hub each time. (Full state is still sent on
      // every API reconnect.)
      auto compute = [&]() -> std::string {
        if (!id(com_ok).state) return {"Unknown"};
        bool cc = id(compressor_stage1).state;
        bool cc2 = id(compressor_stage2).state;
        bool rv = id(reversing_valve).state;
        bool eh1 = id(aux_heat_1).state;
        bool eh2 = id(aux_heat_2).state;
        bool blower = id(blower_on).state;

        if (cc || cc2) {
          std::string stage = cc2 ? "2" : "1";
          std::string mode = rv ? "Cooling" : "Heating";
          return {mode + " " + stage};
        }
        if (eh1 || eh2) {
          return {"Aux Heat"};
        }
        if (blower) {
          return {"Fan Only"};
        }
        return {"Idle"};
      };
      std::string s = compute();
      if (id(current_mode).has_state() && s == id(current_mode).state) return {};
      return s;

  # Fault code -> text lookup, ported from daemonp/esphome_waterfurnace_aurora
  # registers.cpp get_fault_description() (67-case table, upstream at
  # https://github.com/daemonp/esphome_waterfurnace_aurora/blob/master/components/waterfurnace_aurora/registers.cpp).
  # Duplicated across the two sensors below (last fault vs. lockout fault) to
  # keep this a single self-contained YAML file with no external includes.
  - platform: template
    id: fault_description
    name: "Last Fault Description"
    update_interval: ${update_interval_s}s
    lambda: |-
      // Only publish when the text actually changes -- this template
      // re-evaluates every poll, and an identical string would otherwise
      // be pushed to the hub each time. (Full state is still sent on
      // every API reconnect.)
      auto compute = [&]() -> std::string {
        if (!id(com_ok).state) return {"Unknown"};
        uint16_t code = (uint16_t) id(last_fault_code).state;
        switch (code) {
          case 0: return {"No Fault"};
          case 1: return {"Input Error"};
          case 2: return {"High Pressure"};
          case 3: return {"Low Pressure"};
          case 4: return {"Freeze Detect FP2"};
          case 5: return {"Freeze Detect FP1"};
          case 7: return {"Condensate Overflow"};
          case 8: return {"Over/Under Voltage"};
          case 9: return {"AirF/RPM"};
          case 10: return {"Compressor Monitor"};
          case 11: return {"FP1/2 Sensor Error"};
          case 12: return {"RefPerfrm Error"};
          case 13: return {"Non-Critical AXB Sensor Error"};
          case 14: return {"Critical AXB Sensor Error"};
          case 15: return {"Hot Water Limit"};
          case 16: return {"VS Pump Error"};
          case 17: return {"Communicating Thermostat Error"};
          case 18: return {"Non-Critical Communications Error"};
          case 19: return {"Critical Communications Error"};
          case 21: return {"Low Loop Pressure"};
          case 22: return {"Communicating ECM Error"};
          case 23: return {"HA Alarm 1"};
          case 24: return {"HA Alarm 2"};
          case 25: return {"AxbEev Error"};
          case 41: return {"High Drive Temp"};
          case 42: return {"High Discharge Temp"};
          case 43: return {"Low Suction Pressure"};
          case 44: return {"Low Condensing Pressure"};
          case 45: return {"High Condensing Pressure"};
          case 46: return {"Output Power Limit"};
          case 47: return {"EEV ID Comm Error"};
          case 48: return {"EEV OD Comm Error"};
          case 49: return {"Cabinet Temperature Sensor"};
          case 51: return {"Discharge Temp Sensor"};
          case 52: return {"Suction Pressure Sensor"};
          case 53: return {"Condensing Pressure Sensor"};
          case 54: return {"Low Supply Voltage"};
          case 55: return {"Out of Envelope"};
          case 56: return {"Drive Over Current"};
          case 57: return {"Drive Over/Under Voltage"};
          case 58: return {"High Drive Temp"};
          case 59: return {"Internal Drive Error"};
          case 61: return {"Multiple Safe Mode"};
          case 71: return {"Loss of Charge"};
          case 72: return {"Suction Temperature Sensor"};
          case 73: return {"Leaving Air Temperature Sensor"};
          case 74: return {"Maximum Operating Pressure"};
          case 99: return {"System Reset"};
          default: return {"Unknown Fault"};
        }
      };
      std::string s = compute();
      if (id(fault_description).has_state() && s == id(fault_description).state) return {};
      return s;

  - platform: template
    id: lockout_fault_description
    name: "Last Lockout Event Description"
    update_interval: ${update_interval_s}s
    lambda: |-
      // Only publish when the text actually changes -- this template
      // re-evaluates every poll, and an identical string would otherwise
